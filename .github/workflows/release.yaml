name: CI

on:
  push:
    branches: [ main ]
    # Path filters are not evaluated for tag pushes, so releases always run
    tags: [ "*" ]
    paths:
    - src/**
    - tests/**
    - LICENSE*
    - README.md
    - pyproject.toml
    - .github/workflows/release.yaml
  pull_request:
    branches: [ main ]
    paths:
    - src/**
    - tests/**
    - LICENSE*
    - README.md
    - pyproject.toml
    - .github/workflows/release.yaml
  workflow_dispatch: {}
  schedule:
  - cron: "40 12 * * 1-5"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: 3.x
    - uses: astral-sh/setup-uv@v10.3.3
    - name: Lint and type check
      run: |
        uvx tox -m lint

  build:
    name: Build and Inspect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    continue-on-error: ${{ matrix.python-version == '3.13' || matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "3.16"
        - "pypy3.12"
        include:
        - python-version: "3.7"
          os: "ubuntu-22.04"
        - python-version: "3.8"
          os: "ubuntu-24.04"
        - python-version: "3.9"
          os: "ubuntu-24.04"
        - python-version: "3.15"
          os: "windows-latest"
        - python-version: "3.15"
          os: "macos-latest"
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@v10.3.3
    # Run the latest tox on a modern interpreter, independent of the matrix Python
    # (otherwise uv resolves an old tox on 3.8/3.9). tox-uv creates the test env
    # with `uv venv`, which still supports Python 3.7 (virtualenv does not).
    - name: Run tests against the pre-built wheel
      shell: bash
      run: |
        uvx --python 3.14 --with tox-uv tox@latest run -e "${{ matrix.python-version }}" --installpkg dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ lint, build, test ]
    environment: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # Use PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - name: Publish
      uses: pypa/gh-action-pypi-publish@v1.14.3
